name: Build and release firmware

on:
  push:
    tags:
      - "fw-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da versao (ex: fw-v1.0.0-teste) - so usada em disparo manual'
        required: true
        default: "fw-v0.0.0-teste"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      # Um caminho tipo /dev/ttyUSB99 que nao existe de verdade faz o
      # PlatformIO/esptool abortar ANTES de montar e imprimir o comando
      # write_flash no Linux (diferente do Windows, onde uma porta COM
      # inexistente ainda deixa o comando ser impresso antes de falhar) -
      # confirmado rodando a CI de verdade (2026-09-06). Criamos um par de
      # pseudo-terminais de verdade com socat: sao dispositivos validos pro
      # SO, entao o upload chega a tentar abrir e conversar com a porta
      # (e falha por timeout/protocolo, sem placa real do outro lado) - a
      # essa altura o comando completo ja foi montado e impresso.
      - name: Create a fake serial port (no board attached on this runner)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq socat
          socat -d -d pty,raw,echo=0,link=/tmp/ttyFAKE0 pty,raw,echo=0,link=/tmp/ttyFAKE1 &
          for i in $(seq 1 20); do
            [ -e /tmp/ttyFAKE0 ] && break
            sleep 0.5
          done
          ls -la /tmp/ttyFAKE0 /tmp/ttyFAKE1

      # Build normal (sem -v) primeiro: instala platform/tools/libs e
      # compila. Precisa ser separado do passo verboso abaixo porque o
      # tool-scons que a instalacao do zero traz tem um bug real no modo
      # verbose (ver patch_scons_verbose_bug.py) - rodar sem -v aqui evita
      # esbarrar nele antes mesmo de instalar os pacotes que o patch
      # precisa encontrar.
      - name: Build firmware (no verbose - avoids the scons bug below)
        working-directory: firmware
        env:
          FW_VERSION: ${{ steps.version.outputs.tag }}
        run: pio run -e esp32-s3-devkitc-1

      - name: Patch known SCons verbose-mode bug (see script for details)
        run: python3 .github/scripts/patch_scons_verbose_bug.py

      # Builda de novo (cache do PlatformIO faz isso ser rapido - nada
      # mudou desde o passo anterior) e, na mesma chamada, tenta gravar na
      # porta fake criada acima - so' precisamos do log verboso que o
      # PlatformIO imprime ANTES/ao tentar a gravacao, com o comando esptool
      # completo (chip, offsets, arquivos). A falha em si e' esperada
      # (`|| true`, nao ha placa real do outro lado do pseudo-terminal); o
      # que importa e' o upload_log.txt gerado.
      - name: Build firmware and capture verbose upload command
        working-directory: firmware
        env:
          FW_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          pio run -e esp32-s3-devkitc-1 -t upload -v --upload-port /tmp/ttyFAKE0 > upload_log.txt 2>&1 || true
          echo "----- upload_log.txt -----"
          cat upload_log.txt

      - name: Extract real flash parameters from the build
        working-directory: firmware
        run: |
          python3 ../.github/scripts/extract_flash_args.py upload_log.txt > flash_args.txt
          echo "----- flash_args.txt -----"
          cat flash_args.txt

      - name: Merge into a single flashable binary
        working-directory: firmware
        run: |
          MERGED_NAME="drumcore-firmware-${{ steps.version.outputs.tag }}.bin"
          echo "MERGED_NAME=$MERGED_NAME" >> "$GITHUB_ENV"

          FLASH_MODE=$(awk '$1=="flash_mode"{print $2}' flash_args.txt)
          FLASH_FREQ=$(awk '$1=="flash_freq"{print $2}' flash_args.txt)
          FLASH_SIZE=$(awk '$1=="flash_size"{print $2}' flash_args.txt)
          echo "FLASH_MODE=$FLASH_MODE" >> "$GITHUB_ENV"
          echo "FLASH_FREQ=$FLASH_FREQ" >> "$GITHUB_ENV"
          echo "FLASH_SIZE=$FLASH_SIZE" >> "$GITHUB_ENV"

          # So as linhas "0x... arquivo.bin" (pula as 3 primeiras linhas de
          # metadados flash_mode/flash_freq/flash_size).
          ARGS=$(awk '$1 ~ /^0x/{printf "%s %s ", $1, $2}' flash_args.txt)

          esptool --chip esp32s3 merge_bin -o "$MERGED_NAME" \
            --flash_mode "$FLASH_MODE" --flash_freq "$FLASH_FREQ" --flash_size "$FLASH_SIZE" $ARGS

      - name: Write manifest.json
        working-directory: firmware
        run: |
          cat > manifest.json << JSON
          {
            "version": "${{ steps.version.outputs.tag }}",
            "chip": "esp32s3",
            "flash_size": "${{ env.FLASH_SIZE }}",
            "flash_mode": "${{ env.FLASH_MODE }}",
            "flash_freq": "${{ env.FLASH_FREQ }}",
            "offset": "0x0",
            "file": "${{ env.MERGED_NAME }}"
          }
          JSON
          cat manifest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Firmware ${{ steps.version.outputs.tag }}"
          body: |
            Firmware DrumCore (ESP32-S3), gerado automaticamente a partir
            desta tag. `${{ env.MERGED_NAME }}` e' um binario unico
            (bootloader + partition table + app mesclados) - grava tudo de
            uma vez no offset 0x0. Ver `manifest.json` pros parametros de
            flash.
          files: |
            firmware/${{ env.MERGED_NAME }}
            firmware/manifest.json

      # Publica os mesmos 2 arquivos tambem em raw.githubusercontent.com
      # (via um branch dedicado no proprio repo) - diferente dos assets da
      # Release (que redirecionam pra release-assets.githubusercontent.com,
      # sem CORS liberado), raw.githubusercontent.com manda
      # Access-Control-Allow-Origin: * pra qualquer arquivo do repo.
      # E' o que permite o app (site/app/) baixar o firmware direto do
      # navegador, sem processo nativo nenhum como intermediario.
      # Um commit por release (sem --force, sem recriar o orphan toda vez)
      # - preserva o historico de versoes.
      - name: Publish to raw.githubusercontent.com (firmware-artifacts branch)
        run: |
          rm -rf /tmp/firmware-artifacts-repo
          git clone --depth 1 --branch firmware-artifacts \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            /tmp/firmware-artifacts-repo \
            || (mkdir -p /tmp/firmware-artifacts-repo && cd /tmp/firmware-artifacts-repo && git init -q -b firmware-artifacts)
          cd /tmp/firmware-artifacts-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git remote get-url origin > /dev/null 2>&1; then
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          fi
          mkdir -p "${{ steps.version.outputs.tag }}"
          cp "${{ github.workspace }}/firmware/${{ env.MERGED_NAME }}" "${{ steps.version.outputs.tag }}/"
          cp "${{ github.workspace }}/firmware/manifest.json" "${{ steps.version.outputs.tag }}/"
          git add "${{ steps.version.outputs.tag }}"
          git commit -q -m "firmware ${{ steps.version.outputs.tag }}"
          git push -q origin firmware-artifacts
