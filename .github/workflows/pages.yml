name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "web-app/**"
      - "desktop-app/src/renderer/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build web-app (versão web do app desktop)
        working-directory: web-app
        run: |
          (npm ci && npm run build) > /tmp/webapp_build_log.txt 2>&1
          cat /tmp/webapp_build_log.txt

      # Diagnostico temporario (2026-09-06): esse passo esta falhando na CI
      # mas nao localmente - publica o log num branch dedicado pra ler sem
      # precisar de token de autenticacao. Remover assim que resolvido.
      - name: Publish build log for unauthenticated debugging
        if: always()
        run: |
          rm -rf /tmp/debug-log-repo
          mkdir -p /tmp/debug-log-repo
          cd /tmp/debug-log-repo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ci-debug-logs
          cp /tmp/webapp_build_log.txt webapp_build_log.txt
          git add webapp_build_log.txt
          git commit -q -m "debug: webapp build log from run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-debug-logs

      # Junta o site estatico com o build do app web num diretorio unico
      # antes de publicar - app fica acessivel em /app/ dentro do site.
      - name: Assemble Pages artifact
        run: |
          rm -rf pages-dist
          cp -r site pages-dist
          mkdir -p pages-dist/app
          cp -r web-app/dist/. pages-dist/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
