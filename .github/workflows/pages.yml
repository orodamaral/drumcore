name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "web-app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build web-app
        working-directory: web-app
        run: |
          npm ci
          npm run build

      # Junta o site estatico com o build do app web num diretorio unico
      # antes de publicar - app fica acessivel em /app/ dentro do site.
      - name: Assemble Pages artifact
        run: |
          rm -rf pages-dist
          cp -r site pages-dist
          mkdir -p pages-dist/app
          cp -r web-app/dist/. pages-dist/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
