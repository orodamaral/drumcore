name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "web-app/**"
      - "desktop-app/src/renderer/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # web-app/ importa os componentes React direto de
      # desktop-app/src/renderer/src/ (sem duplicar codigo - ver
      # web-app/vite.config.ts), mas a resolucao de modulos do
      # TypeScript/Node sobe a partir do ARQUIVO que importa, nao da raiz
      # do projeto que chamou o tsc - como esses arquivos fisicamente
      # moram em desktop-app/, precisam do desktop-app/node_modules
      # instalado (react, react-dom, esptool-js e os @types/* deles) pra
      # resolver. Sem isso, o typecheck falha com "Cannot find module
      # 'react'" (build completo, com devDependencies - so' as prod deps
      # nao bastam, os @types/* ficam em devDependencies).
      - name: Install desktop-app dependencies (usadas pelos componentes reaproveitados)
        working-directory: desktop-app
        run: npm ci

      - name: Install and build web-app (versão web do app desktop)
        working-directory: web-app
        run: |
          npm ci
          npm run build

      # Junta o site estatico com o build do app web num diretorio unico
      # antes de publicar - app fica acessivel em /app/ dentro do site.
      - name: Assemble Pages artifact
        run: |
          rm -rf pages-dist
          cp -r site pages-dist
          mkdir -p pages-dist/app
          cp -r web-app/dist/. pages-dist/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
