; Firmware do módulo MIDI-USB DrumCore (ESP32-S3)
; Ver docs/01-decisoes-arquiteturais.md para o racional das escolhas abaixo.

[env:esp32-s3-devkitc-1]
; Versao fixada (2026-09-06): sem isso, a CI (que sempre instala do zero)
; puxa a "latest" do momento, que diverge silenciosamente da versao em
; cache local - foi exatamente o que quebrou o build na CI (7.1.1 la' vs
; 7.0.1 aqui, testado e funcionando). Atualizar esta versao de proposito,
; testando localmente antes, se precisar de algo novo de uma versao mais
; recente da plataforma.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Exclui os testes isolados (test_display.cpp, test_pads.cpp, test_rgbled.cpp,
; test_hall.cpp) desta build - cada um tem seu proprio setup()/loop(),
; entrariam em conflito com main.cpp.
build_src_filter = +<*> -<test_display.cpp> -<test_pads.cpp> -<test_rgbled.cpp> -<test_hall.cpp>

; Injeta -D FW_VERSION="..." a partir da env var FW_VERSION (setada pelo
; workflow de release do firmware a partir da tag git) - ver
; firmware/version_flag.py e o guard "#ifndef FW_VERSION" em main.cpp.
extra_scripts = pre:version_flag.py

; O board "esp32-s3-devkitc-1" da PlatformIO e' um perfil generico
; (N8: 8MB flash, sem PSRAM) que nao bate com o modulo real da placa
; comprada, confirmado na serigrafia em 2026-08-31: ESP32-S3-N16R8 (16MB
; flash quad + 8MB PSRAM octal). Overrides abaixo pra refletir o hardware
; real (ver docs/01-decisoes-arquiteturais.md e docs/02-hardware.md) -
; baseado no board de referencia da 4D Systems pra essa mesma combinacao
; (framework-arduinoespressif32/boards/4d_systems_esp32s3_gen4_r8n16.json).
; flash_mode "qio" ja e' o default do board base, nao precisa repetir aqui.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; A lib base HelloDrum-arduino-Library é vendorizada em lib/ (PlatformIO a
; detecta automaticamente por ter library.properties).

; USB-MIDI nativo (Fase B): o board esp32-s3-devkitc-1 vem por padrão com
; ARDUINO_USB_MODE=1 (modo "Hardware CDC and JTAG" - USB-Serial-JTAG interno,
; sem classes USB customizadas). Para expor uma classe MIDI USB de verdade
; precisamos do modo TinyUSB/OTG (ARDUINO_USB_MODE=0), confirmado lendo
; framework-arduinoespressif32/boards.txt (menu "USB Mode") e USB.h no core
; instalado. Ver docs/03-biblioteca-hellodrum.md e docs/01-decisoes-arquiteturais.md.
build_flags =
    -D ARDUINO_USB_MODE=0
    ; ARDUINO_USB_CDC_ON_BOOT=0 (2026-08-31, corrigido - antes 1): com 1, o
    ; app_main() do core (cores/esp32/main.cpp) chama Serial.begin() (USBCDC)
    ; ANTES do setup() do sketch, antes do nosso TinyUSBDevice.begin(0) -
    ; trava esperando a pilha Adafruit TinyUSB que ainda nao existe, watchdog
    ; reseta (RTCWDT_RTC_RST) num loop infinito antes mesmo do setup() ser
    ; alcancado. Com 0, so o nosso Serial.begin() manual (chamado em setup(),
    ; DEPOIS do TinyUSBDevice.begin()) roda. Ver docs/01-decisoes-arquiteturais.md.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; Modulo real e' N16R8 (PSRAM octal, ver overrides de board acima) -
    ; sem essa flag, o core arduino-esp32 nao inicializa a PSRAM externa.
    -D BOARD_HAS_PSRAM
    ; O core arduino-esp32 3.x ja embute uma TinyUSB pre-compilada
    ; (libarduino_tinyusb.a, usada por USB.cpp/USBCDC/USBMSC) e a lib
    ; Adafruit TinyUSB compila a sua propria a partir do source - as duas
    ; juntas duplicam simbolos (tusb.c, usbd.c, etc) e o link falha. Forcamos
    ; o linker a manter a primeira definicao encontrada (a da Adafruit, que e
    ; a que realmente usamos). Conflito conhecido dessa combinacao de versoes.
    -Wl,--allow-multiple-definition

lib_deps =
    adafruit/Adafruit TinyUSB Library
    FortySevenEffects/MIDI Library
    ; Fase C: tela TFT (ST7735) + 2 encoders rotativos com chave.
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    mathertel/RotaryEncoder
    ; Fase E: protocolo serial NDJSON com o app desktop.
    bblanchon/ArduinoJson
    ; Fase H: BLE-MIDI. Usa a stack Bluedroid (BLEDevice.h) ja embutida no
    ; core arduino-esp32 - sem dependencia extra alem dessa lib. O
    ; library.properties dela tambem declara NimBLE-Arduino/ArduinoBLE como
    ; deps (usados por outras variantes de hardware que nao usamos aqui, ver
    ; docs/01-decisoes-arquiteturais.md) - se o LDF tentar puxar essas duas
    ; e causar conflito, adicionar lib_ignore pra elas.
    lathoub/BLE-MIDI

