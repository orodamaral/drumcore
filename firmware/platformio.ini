; Usado pra isolar e confirmar o bug do array pads[] travando o boot com
; 27+ elementos (ver hellodrum.h/.cpp e docs/01-decisoes-arquiteturais.md
; pro diagnostico e a correcao - construtor padrao + begin()). Reproduz a
; forma ja corrigida com os 32 pads completos, serve de teste rapido se a
; lib for mexida de novo. Uso: pio run -e test_pads -t upload
; --upload-port COM5.
[env:test_pads]
