; Firmware do módulo MIDI-USB HelloDrum (ESP32-S3)
; Ver docs/01-decisoes-arquiteturais.md para o racional das escolhas abaixo.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; A lib base HelloDrum-arduino-Library é vendorizada em lib/ (PlatformIO a
; detecta automaticamente por ter library.properties).

; TODO: habilitar o modo USB nativo (TinyUSB) do ESP32-S3 para USB-MIDI classe
; de dispositivo. Provavelmente via build_flags como:
;   -D ARDUINO_USB_MODE=0
;   -D ARDUINO_USB_CDC_ON_BOOT=0
; A confirmar quando iniciarmos a implementação do envio MIDI via USB nativo.
; build_flags =
;     -D ARDUINO_USB_MODE=0
;     -D ARDUINO_USB_CDC_ON_BOOT=0
